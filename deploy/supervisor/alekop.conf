; Workers de fila do alekop.com. Publicado por `envoy run supervisor` em
; /etc/supervisor/conf.d/laravel-horizon.conf — o mesmo arquivo do setup manual
; antigo, para substituí-lo em vez de criar um segundo Horizon ao lado.
;
; user=www-data, o mesmo usuário do php-fpm. Com os workers como root, tudo o que
; eles escrevem (laravel.log, arquivos em storage/, caches) fica do root, e a web
; deixa de conseguir reescrever: o erro de permissão aparece longe da causa.
;
; `stopwaitsecs` precisa ser maior que o maior timeout de job (60s no Horizon,
; config/horizon.php; 60s padrão no worker da newsletter). Senão o Supervisor
; mata o job no meio durante o deploy, sem `failed()` e sem linha em failed_jobs.

[program:laravel-horizon]
; Fila `default`: formulário de contato, e-mail de pedido aprovado etc.
command=php /var/www/alekop.com/public_html/artisan horizon
directory=/var/www/alekop.com/public_html
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/alekop.com/public_html/storage/logs/horizon.log
stopwaitsecs=90

[program:laravel-newsletter]
; Fila `newsletter`, separada para controlar a taxa de envio (README › Newsletter).
command=php /var/www/alekop.com/public_html/artisan queue:work redis --queue=newsletter --sleep=3 --tries=3 --backoff=60 --max-time=3600
directory=/var/www/alekop.com/public_html
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/alekop.com/public_html/storage/logs/newsletter-worker.log
stopwaitsecs=90

; Para tratar os workers como uma coisa só: `supervisorctl status alekop:*`,
; `supervisorctl restart alekop:`.
[group:alekop]
programs=laravel-horizon,laravel-newsletter
